<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N9J STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#15131b;background:white}.header{min-height:158px;display:flex;align-items:end;padding:20px 2.2% 22px;gap:32px;justify-content:space-between}.brand{font-family:Georgia,serif;white-space:nowrap;font-size:clamp(30px,3.2vw,66px);letter-spacing:-2px;color:#050505}.brand .nine,.avatar span{font-style:italic;color:#bd943e;text-shadow:1px 1px #f7e3a1}.brand small{font-size:.66em;letter-spacing:-1px}.nav{display:flex;align-items:center;gap:25px;white-space:nowrap}.nav a{color:#171420;text-decoration:none;font-size:16px;font-weight:700;padding-bottom:12px}.nav a.active{border-bottom:3px solid #ed82a6}.nav .pink{color:#a6295c}.right{display:flex;align-items:center;gap:13px}.lang,.signin{border:1px solid #dedee2;border-radius:28px;background:#fff;padding:12px;font-size:15px}.lang{font-weight:700}.signin{white-space:nowrap}.iconbtn{background:none;border:0;font-size:32px;cursor:pointer}.avatar{background:#fce9ed;border-radius:50%;width:76px;height:76px;display:grid;place-items:center;font:32px Georgia,serif;flex-shrink:0}.breadcrumb{background:linear-gradient(100deg,#f9dce6,#fff0f5,#f8dce7);padding:30px 4.6%;font-size:17px}.mobile-toggle{display:none}.nav a:hover,.iconbtn:hover{color:#d85288}@media(max-width:1450px){.header{gap:18px}.nav{gap:13px}.nav a{font-size:13px}.brand{font-size:38px}.avatar{width:55px;height:55px}}@media(max-width:1050px){.header{align-items:center;min-height:100px;flex-wrap:wrap}.mobile-toggle{display:block;border:0;background:white;font-size:28px}.nav{display:none;order:3;width:100%;flex-wrap:wrap;padding:16px 0}.nav.open{display:flex}.right{margin-left:auto}.brand{font-size:38px}.breadcrumb{padding:24px}}@media(max-width:520px){.brand{font-size:29px}.right{gap:5px}.avatar{display:none}.iconbtn{font-size:24px}.signin{padding:9px}.lang{padding:9px;font-size:12px}}</style></head><body><header class="header"><button class="mobile-toggle" aria-label="Menu" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button><div class="brand">N<span class="nine">9</span>J <small>STORE</small></div><nav class="nav" id="nav"></nav><div class="right"><select class="lang" id="language" aria-label="Language"><option value="en">⌄ English 🇬🇧 🌐</option><option value="ar">⌄ العربية 🇸🇦 🌐</option><option value="am">⌄ አማርኛ 🇪🇹 🌐</option></select><button class="signin" id="sign">Sign in</button><button class="iconbtn" aria-label="Favorites" onclick="location.href='/favorites'">♡</button><button class="iconbtn" aria-label="Cart" onclick="location.href='/cart'">🛒</button><div class="avatar">N<span>9</span>J</div></div></header><div class="breadcrumb" id="crumb">N9J STORE / Products</div><script>const translations={en:['Home','Why us','Highlights','Explore products','🎀 Pink October','Categories','Contact','Sign in','Products'],ar:['الرئيسية','لماذا نحن','العروض','استكشف المنتجات','🎀 أكتوبر الوردي','الأقسام','تواصل معنا','دخول','المنتجات'],am:['መነሻ','ለምን እኛ','ተመራጭ ምርቶች','ምርቶችን ይመልከቱ','🎀 ሮዝ ጥቅምት','ምድቦች','ያግኙን','ግባ','ምርቶች']};const paths=['/','/#why','/#highlights','/products','/#october','/#categories','/#contact'];function render(lang){let t=translations[lang];document.getElementById('nav').innerHTML=t.slice(0,7).map((x,i)=>`<a class="${i===0?'active':''} ${i===4?'pink':''}" href="${paths[i]}">${x}</a>`).join('');document.getElementById('sign').textContent=t[7];document.getElementById('crumb').textContent='N9J STORE / '+t[8];document.documentElement.lang=lang;document.getElementById('language').value=lang;localStorage.setItem('n9j-lang',lang)}document.getElementById('language').addEventListener('change',e=>render(e.target.value));document.getElementById('sign').onclick=()=>location.href='/login';render(localStorage.getItem('n9j-lang')||'en');</script></body></html>
